openapi: 3.1.0
info:
  title: Code API Notes API
  version: 1.0.0
  description: |
    Notes on outside APIs (built-ins, standard libraries, frameworks) met in code
    review. Index rows carry only a name and a doc link; the review-api skill
    fills in the note the first time the API shows up in a diff.
  x-api-id: code

servers:
  - url: https://api.mogumogu.dev/go
    description: Production
  - url: http://localhost:8003
    description: Local development (direct to the Go service)

tags:
  - name: API Notes
    description: Index rows and notes in code.api_notes.

paths:
  /code/api-notes:
    get:
      tags: [API Notes]
      operationId: listApiNotes
      summary: List every api note row
      description: Every row, index rows included, ordered by lang, package, name. No paging.
      responses:
        '200':
          description: All rows; an empty array when the table is empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '500':
          description: The query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [API Notes]
      operationId: saveApiNote
      summary: Save one note
      description: |
        Inserts the note, or fills the index row of the same (lang, package, name) when that row has
        no summary yet; a filled index row keeps its seeded doc_url. A null first_seen_in means a
        study note: seen_count stays 0 and last_seen_in / last_seen_at stay null.
      security:
        - apiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: A new row was inserted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '200':
          description: The index row of that key was filled in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: The body is not JSON or misses a required field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: That key already carries a note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /code/api-notes/{lang}:
    get:
      tags: [API Notes]
      operationId: listApiNotesByLang
      summary: List the api note rows of one language
      description: Same rows and order as `/code/api-notes`, only those of `lang`. An unknown language returns an empty array, not 404.
      parameters:
        - name: lang
          in: path
          required: true
          description: php | go | nodejs | js | ts | bash | git | postgres | mysql | clickhouse | sparql | rust | java | python | swift
          schema:
            type: string
          example: go
      responses:
        '200':
          description: Rows of that language; an empty array when it has none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '500':
          description: The query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    apiSecret:
      type: http
      scheme: bearer
      description: Static secret shared with the Go service (`API_SECRET`).

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Note:
      type: object
      properties:
        lang:
          type: string
          example: go
        package:
          type: string
          example: strings
        name:
          type: string
          example: Cut
        major_version:
          type: [string, 'null']
          description: Installed major when the note was written; null for built-ins and index rows.
        summary:
          type: [string, 'null']
          description: One plain sentence; null means an index row with no note yet.
        example:
          type: [string, 'null']
        doc_url:
          type: string
          format: uri
        gotcha:
          type: [string, 'null']
        seen_count:
          type: integer
          description: Diffs this API has appeared in; 0 on an index row.
        first_seen_in:
          type: [string, 'null']
        last_seen_in:
          type: [string, 'null']
        last_seen_at:
          type: [string, 'null']
          format: date-time
      required: [lang, package, name, major_version, summary, example, doc_url, gotcha, seen_count, first_seen_in, last_seen_in, last_seen_at]

    NoteInput:
      type: object
      properties:
        lang:
          type: string
          example: go
        package:
          type: string
          example: strings
        name:
          type: string
          example: Cut
        doc_url:
          type: string
          format: uri
          description: Kept only on a new row; a filled index row keeps the seeded link.
        summary:
          type: string
          description: One plain sentence in easy English.
        example:
          type: string
        gotcha:
          type: string
        major_version:
          type: string
        first_seen_in:
          type: string
          description: repo@commit, e.g. work@29fba9d. Omit for a study note.
      required: [lang, package, name, doc_url, summary, example]
